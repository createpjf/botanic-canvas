services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODELS: ${OPENAI_IMAGE_MODELS:-gpt-image-2}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimax.io}
      MINIMAX_IMAGE_MODELS: ${MINIMAX_IMAGE_MODELS:-image-01}
      MINIMAX_VIDEO_MODELS: ${MINIMAX_VIDEO_MODELS:-MiniMax-H3}
      VIDEO_GENERATION_TIMEOUT_MS: ${VIDEO_GENERATION_TIMEOUT_MS:-1200000}
      FLOCK_API_BASE_URL: ${FLOCK_API_BASE_URL:-https://api.flock.io/v1}
      FLOCK_API_KEY: ${FLOCK_API_KEY:-}
      FLOCK_TEXT_MODEL: ${FLOCK_TEXT_MODEL:-}
      PROMPT_REFINEMENT_TIMEOUT_MS: ${PROMPT_REFINEMENT_TIMEOUT_MS:-30000}
      SUPABASE_URL: ${SUPABASE_URL:?请在 .env 配置 SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?请在 .env 配置仅服务端可用的 SUPABASE_SECRET_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-botanic-media}
      SUPABASE_BOOTSTRAP_OWNER_EMAIL: ${SUPABASE_BOOTSTRAP_OWNER_EMAIL:?请在 .env 配置首位所有者邮箱}
      SUPABASE_INVITE_REDIRECT_TO: ${SUPABASE_INVITE_REDIRECT_TO:-}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?请在 .env 配置独立的 REALTIME_TICKET_SECRET}
      REDIS_URL: redis://redis:6379
      MAX_GENERATION_BATCH: ${MAX_GENERATION_BATCH:-8}
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/worker.mjs"]
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODELS: ${OPENAI_IMAGE_MODELS:-gpt-image-2}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimax.io}
      MINIMAX_IMAGE_MODELS: ${MINIMAX_IMAGE_MODELS:-image-01}
      MINIMAX_VIDEO_MODELS: ${MINIMAX_VIDEO_MODELS:-MiniMax-H3}
      VIDEO_GENERATION_TIMEOUT_MS: ${VIDEO_GENERATION_TIMEOUT_MS:-1200000}
      SUPABASE_URL: ${SUPABASE_URL:?请在 .env 配置 SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?请在 .env 配置仅服务端可用的 SUPABASE_SECRET_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-botanic-media}
      SUPABASE_BOOTSTRAP_OWNER_EMAIL: ${SUPABASE_BOOTSTRAP_OWNER_EMAIL:?请在 .env 配置首位所有者邮箱}
      REDIS_URL: redis://redis:6379
      MAX_GENERATION_BATCH: ${MAX_GENERATION_BATCH:-8}
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PERSISTENCE_MODE: server
        VITE_SUPABASE_URL: ${SUPABASE_URL:?请在 .env 配置 SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?请在 .env 配置 SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redis-data:
