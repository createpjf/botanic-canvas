name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 固定回归、评测、安全、架构、构建与 Chromium 产品路径共用本地发布门禁。
      # 不读生产素材、不调用真实 Provider，也不执行远端 migration。
      - run: npx playwright install --with-deps chromium
      - run: npm run release:ready
      - name: Validate Sentry release configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$SENTRY_DSN"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
      - name: Build and upload Sentry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ github.event_name == 'push' && vars.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ github.event_name == 'push' && vars.SENTRY_PROJECT || '' }}
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build
      - run: npm audit --omit=dev --audit-level=high
